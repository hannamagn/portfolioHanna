<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Hanna Magnusson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">Hanna Magnusson</a>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">&#9776;</button>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="wrap section-head">
      <h2>Let's talk</h2>
    </div>

    <div class="wrap contact-grid">
      <div class="contact-list">
        <div class="contact-item">
          <div class="ico">&#9993;</div>
          <div>
            <div class="label">Email</div>
            <a class="value" href="mailto:hanna012008@hotmail.com">hanna012008@hotmail.com</a>
          </div>
        </div>
        <div class="contact-item">
          <div class="ico">&#9742;</div>
          <div>
            <div class="label">Phone</div>
            <a class="value" href="tel:+46767781919">+46 76 778 1919</a>
          </div>
        </div>
        <div class="contact-item">
          <div class="ico">in</div>
          <div>
            <div class="label">LinkedIn</div>
            <a class="value" href="https://www.linkedin.com/in/hanna-magnusson-28787324a" target="_blank" rel="noopener">hanna-magnusson-28787324a</a>
          </div>
        </div>
        <div class="contact-item">
          <div class="ico">&#128205;</div>
          <div>
            <div class="label">Based in</div>
            <div class="value">Gothenburg, Sweden</div>
          </div>
        </div>
      </div>

      <form
        class="contact-form"
        action="https://formspree.io/f/xkjogjvz"
        method="POST">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn">Send message</button>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>&copy; 2026 Hanna Magnusson</p>
    <div class="footer-links">
      <a href="https://www.linkedin.com/in/hanna-magnusson-28787324a" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:hanna012008@hotmail.com">Email</a>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
